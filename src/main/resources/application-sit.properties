# ============================================================
# application-sit.properties  — System Integration Testing (AWS)
# ============================================================

# DataSource — RDS Aurora MySQL (credentials from AWS Secrets Manager)
spring.datasource.url=jdbc:mysql://${DB_HOST:sit-aurora.cluster-xxxx.ap-southeast-1.rds.amazonaws.com}:3306/flight_db?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000

# Redis — ElastiCache (cluster mode disabled for SIT)
spring.data.redis.host=${REDIS_HOST:sit-redis.xxxx.cache.amazonaws.com}
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=true

# Amadeus — sandbox credentials from Secrets Manager
amadeus.api.client-id=${AMADEUS_CLIENT_ID}
amadeus.api.client-secret=${AMADEUS_CLIENT_SECRET}

# Notifications
app.notifications.email.enabled=true
app.notifications.sms.enabled=false
app.notifications.email.from=noreply-sit@flightbooking.example.com

# AWS region
spring.cloud.aws.region.static=ap-southeast-1

# CORS — SIT frontend CloudFront URL
app.cors.allowed-origins=https://sit.flightbooking.example.com

logging.level.com.example.booking=INFO
