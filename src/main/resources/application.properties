# ============================================================
# application.properties  (shared defaults — all profiles inherit)
# ============================================================
spring.application.name=flight-booking-service
spring.profiles.default=local

# JPA — profile-specific datasource URLs override these
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway — managed migrations instead of ddl-auto
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.export.cloudwatch.namespace=FlightBooking

# Amadeus API
amadeus.api.base-url=https://test.api.amadeus.com
amadeus.api.token-url=${amadeus.api.base-url}/v1/security/oauth2/token
amadeus.api.locations-url=${amadeus.api.base-url}/v1/reference-data/locations
amadeus.api.flight-search-url=${amadeus.api.base-url}/v2/shopping/flight-offers
amadeus.api.flight-price-url=${amadeus.api.base-url}/v1/shopping/flight-offers/pricing
amadeus.api.booking-url=${amadeus.api.base-url}/v1/booking/flight-orders

# Cache TTL (seconds)
app.cache.flight-offers-ttl=300
app.cache.airport-ttl=3600
app.airports.sync.fixed-delay-ms=3600000

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.amadeus.sliding-window-size=10
resilience4j.circuitbreaker.instances.amadeus.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.amadeus.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.amadeus.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.amadeus.max-attempts=3
resilience4j.retry.instances.amadeus.wait-duration=1s

# CORS — tightened per environment below
app.cors.allowed-origins=http://localhost:5173

# Mail (overridden per profile)
spring.mail.default-encoding=UTF-8
app.mail.from=noreply@souloftrips.com
app.mail.from-name=Soul of Trips

# Stripe (override with real keys per environment)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.currency=USD

# Notifications
app.notifications.email.enabled=true
