# ============================================================
# application-uat.properties  — User Acceptance Testing (AWS)
# ============================================================

# DataSource — RDS Aurora MySQL Multi-AZ
spring.datasource.url=jdbc:mysql://${DB_HOST:uat-aurora.cluster-xxxx.ap-southeast-1.rds.amazonaws.com}:3306/flight_db?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Redis — ElastiCache with TLS
spring.data.redis.host=${REDIS_HOST:uat-redis.xxxx.cache.amazonaws.com}
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=2000

# Amadeus — UAT uses production endpoint
amadeus.api.base-url=https://api.amadeus.com
amadeus.api.token-url=${amadeus.api.base-url}/v1/security/oauth2/token
amadeus.api.flight-search-url=${amadeus.api.base-url}/v2/shopping/flight-offers
amadeus.api.flight-price-url=${amadeus.api.base-url}/v1/shopping/flight-offers/pricing
amadeus.api.booking-url=${amadeus.api.base-url}/v1/booking/flight-orders
amadeus.api.client-id=${AMADEUS_CLIENT_ID}
amadeus.api.client-secret=${AMADEUS_CLIENT_SECRET}

# Notifications — both email & SMS active
app.notifications.email.enabled=true
app.notifications.sms.enabled=true
app.notifications.email.from=noreply-uat@flightbooking.example.com

# AWS
spring.cloud.aws.region.static=ap-southeast-1

# CORS
app.cors.allowed-origins=https://uat.flightbooking.example.com

logging.level.com.example.booking=INFO
