# ============================================================
# application-local.properties  — LOCAL development
# ============================================================

# DataSource (local MySQL — no SSL)
spring.datasource.url=jdbc:mysql://localhost:3306/flight_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Redis (local)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple
management.health.redis.enabled=false

# JPA verbose logging for dev
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Flyway — allow existing local schema to be baselined, while still migrating a fresh DB from V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Amadeus credentials (dev sandbox)
amadeus.api.client-id=${AMADEUS_CLIENT_ID:5oyGz61T78SLivzJZf2lRg6StYIr9wig}
amadeus.api.client-secret=${AMADEUS_CLIENT_SECRET:Ms0d7GAD5NU0Fqfz}

# Mail — MailHog local SMTP (docker-compose exposes port 1025)
# Start MailHog: docker run -d -p 1025:1025 -p 8025:8025 mailhog/mailhog
# View captured emails at: http://localhost:8025
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- To send REAL emails instead of MailHog, uncomment and fill in: ---
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-gmail@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Notifications (email via MailHog locally, SMS disabled)
app.notifications.email.enabled=true
app.notifications.sms.enabled=false

# Stripe test keys — from https://dashboard.stripe.com/test/apikeys
# Leave empty to use mock payment (always succeeds without Stripe)
# Add your sk_test_... key below to enable real Stripe payments:
stripe.secret-key=${STRIPE_SECRET_KEY:}

# AWS (disabled locally — uses mock beans)
app.aws.enabled=false

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

logging.level.com.example.booking=DEBUG
