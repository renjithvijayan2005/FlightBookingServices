# ============================================================
# application-prod.properties  — PRODUCTION (AWS)
# ============================================================

# DataSource — RDS Aurora MySQL Serverless v2, Multi-AZ, read replica
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/flight_db?useSSL=true&requireSSL=true&serverTimezone=UTC&useServerPrepStmts=true&cachePrepStmts=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# Redis — ElastiCache Cluster mode, TLS
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=1500
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8

# Amadeus — production credentials
amadeus.api.base-url=https://api.amadeus.com
amadeus.api.token-url=${amadeus.api.base-url}/v1/security/oauth2/token
amadeus.api.flight-search-url=${amadeus.api.base-url}/v2/shopping/flight-offers
amadeus.api.flight-price-url=${amadeus.api.base-url}/v1/shopping/flight-offers/pricing
amadeus.api.booking-url=${amadeus.api.base-url}/v1/booking/flight-orders
amadeus.api.client-id=${AMADEUS_CLIENT_ID}
amadeus.api.client-secret=${AMADEUS_CLIENT_SECRET}

# Notifications
app.notifications.email.enabled=true
app.notifications.sms.enabled=true
app.notifications.email.from=noreply@flightbooking.example.com

# AWS
spring.cloud.aws.region.static=ap-southeast-1

# CORS — production CloudFront
app.cors.allowed-origins=https://www.flightbooking.example.com,https://flightbooking.example.com

# Disable verbose logging in prod
spring.jpa.show-sql=false
logging.level.com.example.booking=WARN
logging.level.org.springframework=WARN

# Security headers
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
